[tool.ruff]
line-length = 100
target-version = "py312"
# Migrations são geradas pelo Django (makemigrations) e não seguem o
# line-length; não faz sentido lintar código gerado.
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade,
# B = bugbear, DJ = flake8-django.
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-q"
